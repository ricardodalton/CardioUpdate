name: CardioUpdate Weekly Evidence

on:
  schedule:
    # Friday 09:35 UTC = 06:35 Argentina (UTC-3)
    - cron: '35 9 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: CardioUpdate_FINAL_AUTO
        run: pip install -r requirements-updater.txt

      - name: Publish weekly cardiology edition
        working-directory: CardioUpdate_FINAL_AUTO
        env:
          CARDIOUPDATE_WEEKLY: '1'
          CARDIOUPDATE_MIN_WEEKLY: '20'
          CARDIOUPDATE_MAX_WEEKLY: '30'
        run: python scripts/update_studies.py

      - name: Validate database
        working-directory: CardioUpdate_FINAL_AUTO
        run: python tests/test_database.py

      - name: Commit weekly edition
        run: |
          git config user.name "CardioUpdate Bot"
          git config user.email "actions@github.com"
          git add CardioUpdate_FINAL_AUTO/data/studies.json CardioUpdate_FINAL_AUTO/data/meta.json
          if git diff --cached --quiet; then
            echo "No weekly changes to commit."
          else
            git commit -m "CardioUpdate: weekly evidence edition"
            git push
          fi
