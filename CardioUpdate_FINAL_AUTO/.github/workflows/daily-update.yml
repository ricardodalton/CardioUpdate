name: CardioUpdate Daily Evidence

on:
  schedule:
    - cron: '35 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: CardioUpdate_FINAL_AUTO
        run: pip install -r requirements-updater.txt

      - name: Update cardiology evidence
        working-directory: CardioUpdate_FINAL_AUTO
        run: python scripts/update_studies.py

      - name: Validate database
        working-directory: CardioUpdate_FINAL_AUTO
        run: python tests/test_database.py

      - name: Commit database update
        run: |
          git config user.name "CardioUpdate Bot"
          git config user.email "actions@github.com"
          git add CardioUpdate_FINAL_AUTO/data/studies.json CardioUpdate_FINAL_AUTO/data/meta.json
          if git diff --cached --quiet; then
            echo "No new evidence to commit."
          else
            git commit -m "CardioUpdate: daily evidence update"
            git push
          fi
